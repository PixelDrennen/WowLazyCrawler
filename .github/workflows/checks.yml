name: Validate and package
on:
  push:
    branches: [main, "feature/**", "fix/**", "patch/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: npm ci --prefix web && npm --prefix web run build
      - run: node --check desktop/main.cjs && node --check desktop/updates.cjs && node --test tests/test_updates.cjs
      - run: for script in scripts/*.sh; do bash -n "$script"; done
  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-lock.txt
      - run: npm ci && npm ci --prefix web
      - run: npm run package:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: .venv/bin/python scripts/smoke-bundle.py build/backend/lazycrawler-server
      - name: Verify RPM desktop integration
        run: |
          rpm -qpl release/*.rpm > /tmp/rpm-files.txt
          cat /tmp/rpm-files.txt
          python -c "from pathlib import Path; files=Path('/tmp/rpm-files.txt').read_text(); assert '/usr/share/applications/wowlazycrawler.desktop' in files; assert '/backend/lazycrawler-server' in files"
      - name: Verify update feed metadata
        run: node scripts/verify-updates.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: lazycrawler-linux-x64
          path: |
            release/*.rpm
            release/*.AppImage
            release/LazyCrawler-addon.zip
            release/latest-linux*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lazycrawler-linux-x64
          path: release
      - name: Publish verified stable update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > /tmp/lc-release-draft 2>/dev/null; then
            if [ "$(cat /tmp/lc-release-draft)" != "true" ]; then
              echo "Release $tag already published; immutable assets retained."
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "LazyCrawler $version" --notes-file docs/release-notes.md
          fi
          gh release upload "$tag" release/*.rpm release/*.AppImage release/LazyCrawler-addon.zip release/latest-linux*.yml --clobber
          gh release edit "$tag" --draft=false --latest
